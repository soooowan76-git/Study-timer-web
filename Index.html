<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>smart study timer</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f2f2; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #timer { font-size: 48px; font-weight: bold; margin: 20px 0; color: #2563eb; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-start { background: #16a34a; color: white; }
        .btn-stop { background: #dc2626; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⏱️ 스마트 학습 타이머</h2>
        <select id="subject">
             <option value="math">math</option>
             <option value="english">english</option>
             <option value="programming">programming</option>
        </select>

        <div id="timer">00:00:00</div>

        <button class="btn-start" onclick="startTimer()">start</button>
        <button class="btn-stop" onclick="stopTimer()">stop & save</button>
    </div>

    <script>
        let seconds = 0;
        let timer = null;

        function updateDisplay() {
            let h = String(Math.floor(seconds / 3600)).padStart(2, '0');
            let m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            let s = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
        }

        function startTimer() {
            if (timer) return;
            timer = setInterval(() => {
                seconds++;
                updateDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timer);
            timer = null;
            const subject = document.getElementById('subject').value;
            // 주의: 변수를 텍스트 안에 넣으려면 작은따옴표(')가 아니라 백틱(`)을 사용해야 합니다.
            alert(`[${subject}] subject${seconds}seconds Study complete! (Waiting for backend transmission)`);
            seconds = 0;
            updateDisplay();
        }
    </script>
</body>
</html>
