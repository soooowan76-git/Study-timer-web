<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Smart Study Timer</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f2f2; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #timer { font-size: 48px; font-weight: bold; margin: 20px 0; color: #2563eb; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-start { background: #16a34a; color: white; }
        .btn-stop { background: #dc2626; color: white; }
    </style>
</head>
<body>
    

    <div class="card">
        <h2>⏱️ 스마트 공부 타이머</h2>
        <select id="subject">
            <option value="수학">수학</option>
            <option value="영어">영어</option>
            <option value="과학">과학</option>
            <option value="사회">사회</option>
            <option value="프로그래밍">프로그래밍</option>
        </select>

        <div id="timer">00:00:00</div>

        <button class="btn-start" onclick="startTimer()">시작</button>
        <button class="btn-stop" onclick="stopTimer()">멈춤 & 저장</button>
    </div>

    <script>
        let seconds = 0;
        let timer = null;
        let startTime = 0;

        function updateDisplay() {
            let h = String(Math.floor(seconds / 3600)).padStart(2, '0');
            let m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            let s = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
        }

        function startTimer() {
            if (timer) return;
            startTime = Date.now() - (seconds * 1000);
            timer = setInterval(() => {
                seconds = Math.floor((Date.now() - startTime) / 1000);
                updateDisplay();
            }, 1000);
        }


        function stopTimer() {
            if (!timer && seconds === 0) return;
            clearInterval(timer);
            timer = null;
            const subject = document.getElementById('subject').value;
            alert(`[${subject}] ${seconds} 초 공부를 끝냈어! (백엔드 전송 대기중...)`);
            seconds = 0;
            updateDisplay();
        }

    </script>
</body>
</html>
